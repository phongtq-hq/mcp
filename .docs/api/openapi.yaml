openapi: 3.1.0
info:
  title: MCP Platform — Management API
  version: 0.1.0
  description: |
    REST API quản trị của MCP Platform. Trạng thái: bản thiết kế, chờ xác nhận.

    **Tách biệt với MCP.** API này chạy trên process `api` (`api.<domain>`).
    Endpoint giao thức MCP chạy trên process `gateway` (`mcp.<domain>/mcp/v1/...`)
    và không được mô tả ở đây; xem docs/architecture/mcp-platform.md.

    **Tenant.** Organization được xác định từ token, không từ đường dẫn.
    Tài nguyên thuộc project được tạo và liệt kê dưới `/projects/{projectId}/...`,
    và được truy cập theo id ở đường dẫn gốc (`/agents/{agentId}`).

    **Phiên bản.** Tiền tố `/v1`. Thay đổi phá vỡ tương thích tạo `/v2`;
    thêm trường và thêm endpoint không tăng phiên bản. Client phải bỏ qua trường lạ.

    **Phân trang.** Theo con trỏ: `limit` (mặc định 50, tối đa 200) và `cursor`.
    Phản hồi có `next_cursor`; `null` nghĩa là hết.

    **Lọc và sắp xếp.** Lọc bằng query parameter riêng cho từng trường.
    Sắp xếp bằng `sort=<trường>` hoặc `sort=-<trường>` (giảm dần), chỉ trên các trường được liệt kê.

    **Idempotency.** Mọi `POST` tạo tài nguyên hoặc kích hoạt hành động nhận header `Idempotency-Key`.
    Gửi lại cùng key và cùng body trả về phản hồi ban đầu; cùng key khác body trả 422.
    Bắt buộc với tạo execution, tạo workflow execution và quyết định approval.

    **Đồng thời.** Tài nguyên sửa được trả `ETag`; `PATCH` và `DELETE` nhận `If-Match`, lệch trả 412.

    **Lỗi.** Mọi lỗi dùng `application/problem+json` (RFC 9457) với trường `code` ổn định cho máy đọc.
    Mã HTTP dùng chung: 400 sai cú pháp, 401 chưa xác thực, 403 không đủ quyền,
    404 không tồn tại (kể cả tài nguyên của tenant khác), 409 xung đột trạng thái,
    412 ETag lệch, 422 sai ngữ nghĩa, 402 vượt budget, 429 quá giới hạn (kèm `Retry-After`).
servers:
  - url: https://api.example.com/v1
security:
  - oidc: []
  - apiKey: []
tags:
  - name: Organization
  - name: Projects
  - name: Agents
  - name: API Keys
  - name: Executions
  - name: MCP
  - name: Workflows
  - name: Approvals
  - name: Models
  - name: Cost
  - name: Audit

paths:
  /organization:
    get:
      tags: [Organization]
      operationId: getOrganization
      summary: Organization của người gọi
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Organization]
      operationId: updateOrganization
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OrganizationUpdate'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: environment, in: query, schema: {$ref: '#/components/schemas/Environment'}}
        - {name: sort, in: query, schema: {type: string, enum: [name, -name, created_at, -created_at], default: -created_at}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{$ref: '#/components/schemas/Page'}]
                properties: {data: {type: array, items: {$ref: '#/components/schemas/Project'}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Projects]
      operationId: createProject
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectCreate'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /projects/{projectId}:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      tags: [Projects]
      operationId: getProject
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Projects]
      operationId: updateProject
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectUpdate'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Projects]
      operationId: archiveProject
      summary: Lưu trữ project (xoá mềm)
      responses:
        '204': {description: Archived}
        default: {$ref: '#/components/responses/Problem'}

  /projects/{projectId}/agents:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      tags: [Agents]
      operationId: listAgents
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/AgentStatus'}}
        - {name: q, in: query, description: Tìm theo tên hoặc slug, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [name, -name, created_at, -created_at], default: name}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{$ref: '#/components/schemas/Page'}]
                properties: {data: {type: array, items: {$ref: '#/components/schemas/Agent'}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Agents]
      operationId: createAgent
      summary: Tạo Agent ở trạng thái draft, kèm version đầu tiên
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentCreate'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /agents/{agentId}:
    parameters: [{$ref: '#/components/parameters/AgentId'}]
    get:
      tags: [Agents]
      operationId: getAgent
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Agents]
      operationId: updateAgent
      summary: Sửa tên, mô tả hoặc trạng thái (active / disabled). Không sửa cấu hình; cấu hình đổi bằng version mới
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentUpdate'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Agents]
      operationId: archiveAgent
      responses:
        '204': {description: Archived}
        default: {$ref: '#/components/responses/Problem'}
  /agents/{agentId}/versions:
    parameters: [{$ref: '#/components/parameters/AgentId'}]
    get:
      tags: [Agents]
      operationId: listAgentVersions
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{$ref: '#/components/schemas/Page'}]
                properties: {data: {type: array, items: {$ref: '#/components/schemas/AgentVersion'}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Agents]
      operationId: createAgentVersion
      summary: Tạo version bất biến mới. Được validate với Tool Registry và quyền của project
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentVersionCreate'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/AgentVersion'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /agents/{agentId}/versions/{version}:
    parameters:
      - {$ref: '#/components/parameters/AgentId'}
      - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      tags: [Agents]
      operationId: getAgentVersion
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AgentVersion'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /agents/{agentId}/active-version:
    parameters: [{$ref: '#/components/parameters/AgentId'}]
    put:
      tags: [Agents]
      operationId: setActiveAgentVersion
      summary: Publish hoặc rollback bằng cách chọn version đang hoạt động
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [version], properties: {version: {type: integer, minimum: 1}}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
        default: {$ref: '#/components/responses/Problem'}

  /api-keys:
    get:
      tags: [API Keys]
      operationId: listApiKeys
      summary: Liệt kê API key của organization (chỉ metadata)
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{$ref: '#/components/schemas/Page'}]
                properties: {data: {type: array, items: {$ref: '#/components/schemas/ApiKey'}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [API Keys]
      operationId: createApiKey
      summary: Tạo API key cho máy / CI
      description: |
        Giá trị của khoá (`key`) chỉ được trả về trong phản hồi này và không lấy lại được.
        Endpoint này không nhận `Idempotency-Key`: phản hồi chứa secret nên không được lưu để phát lại.
        Chỉ người dùng tạo được khoá. Role của khoá phải là role dựng sẵn và không được chứa
        permission mà người tạo không có ở cùng phạm vi.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApiKeyCreate'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/ApiKeyCreated'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api-keys/{apiKeyId}:
    parameters: [{name: apiKeyId, in: path, required: true, schema: {type: string, format: uuid}}]
    delete:
      tags: [API Keys]
      operationId: revokeApiKey
      summary: Thu hồi API key (có hiệu lực ngay; lặp lại là no-op)
      responses:
        '204': {description: No Content}
        default: {$ref: '#/components/responses/Problem'}
  /projects/{projectId}/executions:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get:
      tags: [Executions]
      operationId: listExecutions
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/ExecutionStatus'}}
        - {name: agent_id, in: query, schema: {type: string, format: uuid}}
        - {name: session_id, in: query, schema: {type: string, format: uuid}}
        - {name: initiator_id, in: query, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - {name: sort, in: query, schema: {type: string, enum: [created_at, -created_at, estimated_cost, -estimated_cost], default: -created_at}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{$ref: '#/components/schemas/Page'}]
                properties: {data: {type: array, items: {$ref: '#/components/schemas/Execution'}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Executions]
      operationId: createExecution
      summary: Khởi tạo execution (bất đồng bộ)
      description: |
        Trả 202 ngay sau khi execution được xếp hàng. Theo dõi bằng `GET /executions/{id}`
        hoặc luồng sự kiện `/executions/{id}/events`.
        Trả 402 với `code: budget_exceeded` nếu một budget áp dụng đã chạm ngưỡng cứng.
        Với `mode planned`: 422 `planned_not_enabled` nếu project chưa bật chế độ này
        (`settings.orchestration`, xem OrchestrationSettings), 422 `orchestration_config_invalid`
        nếu cấu hình đã lưu bị hỏng, 422 `validation_failed` nếu kế hoạch không hợp lệ. Mỗi task
        của kế hoạch phải có budget. 429 nếu organization đã đủ số vòng lặp Agent chạy đồng thời
        (execution `planned` chiếm số task nó chạy song song).
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyRequired'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionCreate'}}}}
      responses:
        '202': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Execution'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /executions/{executionId}:
    parameters: [{$ref: '#/components/parameters/ExecutionId'}]
    get:
      tags: [Executions]
      operationId: getExecution
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Execution'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /executions/{executionId}/cancel:
    parameters: [{$ref: '#/components/parameters/ExecutionId'}]
    post:
      tags: [Executions]
      operationId: cancelExecution
      summary: Huỷ execution; lan tới mọi task con và approval đang chờ. Idempotent
      responses:
        '202': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Execution'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /executions/{executionId}/pause:
    parameters: [{$ref: '#/components/parameters/ExecutionId'}]
    post:
      tags: [Executions]
      operationId: pauseExecution
      summary: Tạm dừng tại ranh giới step kế tiếp
      description: |
        Ghi yêu cầu tạm dừng (quyền `execution:cancel`). Mỗi task dừng ở ranh giới bước kế tiếp
        của nó: bước đang chạy (lượt model, tool call, kể cả tool vừa được duyệt) được chạy xong.
        Execution sang `paused` khi vòng lặp thực sự dừng. Thời gian tạm dừng vẫn tính vào hạn
        của execution. Idempotent. 409 `execution_finished` nếu execution đã kết thúc.
        Tạm dừng là công cụ vận hành dựa vào sự hợp tác của vòng lặp, không phải kiểm soát an
        toàn: muốn chắc chắn không bước nào chạy nữa thì huỷ execution.
      responses:
        '202': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Execution'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /executions/{executionId}/resume:
    parameters: [{$ref: '#/components/parameters/ExecutionId'}]
    post:
      tags: [Executions]
      operationId: resumeExecution
      summary: Gỡ yêu cầu tạm dừng; execution chạy tiếp đúng chỗ đã dừng. Idempotent
      description: |
        Người đã yêu cầu tạm dừng tự gỡ được yêu cầu của mình (quyền `execution:cancel`). Gỡ yêu
        cầu tạm dừng của người khác cần thêm quyền `execution:resume`.
      responses:
        '202': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Execution'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /executions/{executionId}/events:
    parameters: [{$ref: '#/components/parameters/ExecutionId'}]
    get:
      tags: [Executions]
      operationId: streamExecutionEvents
      summary: Luồng sự kiện (SSE) về thay đổi trạng thái, step và approval
      description: |
        Server-Sent Events (quyền `execution:read`). Mỗi lần nối, luồng phát trạng thái hiện tại
        rồi tới từng thay đổi, và đóng khi execution kết thúc. Sự kiện:
        `task` (`id`, `status`, `plan_key`, `parent_task_id`, `agent_id`, `depth`),
        `step` (`task_id`, `step_seq`, `kind`, `status`, `tool_name`, `approval_id`),
        `execution` (`id`, `status`, `estimated_cost`, `pause_requested_at`, `cancel_requested`,
        `finished_at`), `end` (execution đã kết thúc; luồng đóng), `reconnect` (luồng đã sống
        tối đa 5 phút; nối lại), `error`. Sự kiện `execution` của một nhịp đi sau `task` và
        `step` của nhịp đó. Sự kiện chỉ mang định danh và trạng thái: không có prompt, arguments
        hay kết quả tool. Không hỗ trợ `Last-Event-ID`: nối lại là được phát lại từ đầu.
        Thay đổi được đọc theo nhịp khoảng một giây. 429 khi có quá nhiều luồng đang mở (tối đa
        4 mỗi người gọi, 16 mỗi organization). Quyền đọc được kiểm lại định kỳ trong lúc luồng mở.
      responses:
        '200': {description: Luồng sự kiện, content: {text/event-stream: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/Problem'}
  /projects/{projectId}/plan-proposals:
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    post:
      tags: [Executions]
      operationId: createPlanProposal
      summary: Nhờ Agent lập kế hoạch đề xuất một kế hoạch (bất đồng bộ)
      description: |
        Chạy Agent lập kế hoạch của project (`settings.orchestration.planner_agent_id`) như một
        execution `single_agent`: nó nhận yêu cầu và danh sách các Agent đang hoạt động của
        project, và trả lời bằng một kế hoạch. Kết quả là một ĐỀ XUẤT: không task nào của kế
        hoạch được chạy. Đọc đề xuất bằng `GET /executions/{id}/plan`, rồi gửi nó (nguyên văn
        hoặc đã sửa) qua `POST /projects/{id}/executions` với `mode: planned`; ở đó kế hoạch
        được kiểm lại như mọi kế hoạch khác.
        Đề xuất là output của model: đầu vào không tin cậy. Chỉ gửi lại nguyên văn khi đã có
        người xem; để chạy tự động, dùng `POST /executions/{id}/plan/run`.
        422 `planned_not_enabled` nếu project chưa bật chế độ planned; 422
        `planner_not_configured` nếu chưa đặt Agent lập kế hoạch; 422 `planner_unavailable` nếu
        nó không thuộc project hoặc không hoạt động; 422 `planner_not_eligible` nếu Agent Version
        của nó có tool, có delegation, hoặc thiếu `limits.budget`.
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyRequired'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlanProposalCreate'}}}}
      responses:
        '202': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Execution'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /executions/{executionId}/plan:
    parameters: [{$ref: '#/components/parameters/ExecutionId'}]
    get:
      tags: [Executions]
      operationId: getExecutionPlanProposal
      summary: Kế hoạch mà một execution lập kế hoạch đã đề xuất
      description: |
        Đọc trả lời của Agent lập kế hoạch và kiểm nó bằng code: đúng định dạng, Agent được nêu
        thuộc project, phụ thuộc tồn tại, không chu trình, trong trần số task và độ sâu. Kế hoạch
        không hợp lệ được báo kèm lý do, không được sửa giúp. `plan` chỉ có khi `status` là `ready`.
        Chỉ execution được tạo bằng `POST /projects/{id}/plan-proposals` mới cho ra đề xuất, và
        kế hoạch chỉ được dùng các Agent đã chọn lúc đề xuất. `ready` nghĩa là đúng cấu trúc,
        không phải nội dung đã được ai xem.
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PlanProposal'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /executions/{executionId}/plan/run:
    parameters: [{$ref: '#/components/parameters/ExecutionId'}]
    post:
      tags: [Executions]
      operationId: runPlanProposal
      summary: Chạy kế hoạch mà một execution lập kế hoạch đã đề xuất
      description: |
        Tạo một execution `planned` thẳng từ đề xuất, ở phía platform (quyền `execution:create`).
        Kế hoạch được kiểm đầy đủ như mọi kế hoạch, và platform ghi nhận nguồn gốc của nó là
        model: `goal` của từng task được đánh dấu là do Agent lập kế hoạch viết, và tool không
        chỉ đọc của các task đó **luôn cần người duyệt**. Dùng đường này khi không có người xem
        lại đề xuất. Tự đọc đề xuất rồi gửi lại qua `mode: planned` thì kế hoạch được xử lý như
        kế hoạch do người gọi viết.
        Chỉ người đã tạo đề xuất mới chạy được nó (403 với người khác), trong vòng 24 giờ (422
        `plan_expired` sau đó): người chạy trở thành người yêu cầu của các approval, và không ai
        viết yêu cầu rồi để người khác chạy để tự duyệt.
        409 `plan_not_ready` nếu lần lập kế hoạch chưa kết thúc; 422 `plan_invalid` nếu đề xuất
        không hợp lệ.
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyRequired'}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/PlanProposalRun'}}}}
      responses:
        '202': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Execution'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /executions/{executionId}/tasks:
    parameters: [{$ref: '#/components/parameters/ExecutionId'}]
    get:
      tags: [Executions]
      operationId: listExecutionTasks
      summary: Cây task của execution
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{$ref: '#/components/schemas/Page'}]
