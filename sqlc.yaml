version: "2"
overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: uuid
        nullable: true
        go_type: {import: github.com/google/uuid, type: UUID, pointer: true}
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type: {import: time, type: Time, pointer: true}
      - db_type: jsonb
        go_type: {import: encoding/json, type: RawMessage}
sql:
  - &ctx
    engine: postgresql
    schema: migrations
    queries: internal/platform/tenancy/store/queries.sql
    gen:
      go: &gen
        package: store
        out: internal/platform/tenancy/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        omit_unused_structs: true
  - <<: *ctx
    queries: internal/platform/identity/store/queries.sql
    gen:
      go:
        <<: *gen
        out: internal/platform/identity/store
  - <<: *ctx
    queries: internal/platform/authz/store/queries.sql
