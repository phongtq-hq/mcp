name: ci
on:
  push:
    # Nhánh mặc định của repo là master; main được giữ để đổi tên nhánh không làm CI im lặng.
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: giao diện — cài phụ thuộc theo package-lock.json
        run: make ui-install
      - name: giao diện — kiểu, lint (luật phụ thuộc, cấm HTML thô)
        run: make ui-lint
      - name: giao diện — test
        run: make ui-test
      # Cả phụ thuộc lúc build: công cụ build sinh ra chính bundle chạy trên origin giữ token.
      - name: giao diện — phụ thuộc (lúc chạy và lúc build) không có lỗ hổng mức cao
        run: cd web && npm audit --audit-level=high
      # File compose của máy chủ (ADR-0017) phải luôn hợp lệ với file env mẫu: lỗi cú pháp ở
      # đây chỉ lộ ra lúc triển khai nếu không kiểm sớm.
      - name: cấu hình triển khai (docker compose config)
        run: make deploy-check
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal migrations tests)"
      - name: go.mod gọn
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: code sinh (sqlc, kiểu API) khớp với nguồn
        run: make generate-check
      - name: build
        run: make build
      - name: lint
        run: make lint
      - name: test (PostgreSQL thật qua testcontainers)
        run: make test
        env:
          # Test của internal/webui kiểm bản build thật; thiếu bản build là lỗi, không bỏ qua.
          HQ_UI_REQUIRE_BUILD: "1"
